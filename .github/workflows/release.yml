name: release

on:
  workflow_dispatch:
    inputs:
      version:
        description: release version in MAJOR.MINOR.PATCH version, no "v" prefix
        required: true
        type: string

permissions:
  contents: write

defaults:
  run:
    shell: bash

env:
  MISE_TRUSTED_CONFIG_PATHS: ${{ github.workspace }}

jobs:
  release:
    runs-on: ubuntu-latest
    container: debian:sid
    env:
      VERSION: ${{ inputs.version }}
    steps:
      - run: apt-get update
      - run: apt-get install -y git ca-certificates curl build-essential pkg-config

      - uses: actions/checkout@v7
      - run: git config --global --add safe.directory "$GITHUB_WORKSPACE"

      - uses: iliabylich/validate-release-version@v1
        with:
          version: ${{ inputs.version }}

      - run: apt-get install -y sassc xxd qt6-base-dev qt6-base-dev-tools liblayershellqtinterface-dev libqtermwidget-dev libutf8proc-dev

      - uses: dtolnay/rust-toolchain@stable

      - uses: jdx/mise-action@v5
      - run: mise run release

      - uses: ncipollo/release-action@v1
        with:
          artifacts: "builddir/ui/layer-shell,systemd/layer-shell.service"
          tag: v${{ inputs.version }}
